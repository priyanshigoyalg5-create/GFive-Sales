<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--bg:#faf5e9;--card:#fff;--ink:#1c2340;--mut:#69708a;--line:#dcd8ce;--ac:#2a3a8c;--on:#fff;--gold:#c9961a;--ok:#1f7a4d;--bad:#b3261e;--inp:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12162b;--card:#1b2140;--ink:#eceefb;--mut:#9aa2c4;--line:#2e3560;--ac:#8fa2ff;--on:#12162b;--gold:#e3b341;--ok:#4cc38a;--bad:#ff8a80;--inp:#141a35;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:600 17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(60px + env(safe-area-inset-bottom,0px))}
h1{font:700 24px Georgia,serif;margin:0}h2{font:700 20px Georgia,serif;margin:0 0 8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
nav{display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
nav button{flex:1 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:8px;font:700 15px inherit;white-space:nowrap}
nav button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
label{display:block;font-size:15px;font-weight:700;color:var(--mut);margin:10px 0 3px}
input[type=date]{-webkit-appearance:none;appearance:none;height:43px;text-align:left}
input,select{width:100%;min-width:0;max-width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--inp);color:var(--ink);font:600 17px inherit}
input[readonly]{cursor:pointer}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.g .w{grid-column:1/3}
.btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:var(--ac);color:var(--on);font:700 17px inherit}
.btn.o{background:none;border:1px solid var(--ac);color:var(--ac)}.btn.r{background:var(--bad);color:#fff}.btn.s{width:auto;padding:6px 12px;margin:0;font-size:13px}
.chip{display:inline-block;font-size:14px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.bad{color:var(--bad);font-weight:700}.ok{color:var(--ok);font-weight:700}.sm{font-size:15px;color:var(--mut)}
.it{border-left:4px solid var(--gold);padding:8px 10px;margin:0 0 10px;border-radius:8px}.it.d{border-left-color:var(--ok)}
#pv{display:none}
@media print{@page{margin:12mm}body>*:not(#pv){display:none!important}body{background:#fff!important;padding:0!important}#pv{display:block;color:#000;background:#fff;font:14px/1.4 Arial,sans-serif}#pv table{width:100%;border-collapse:collapse;margin:6px 0}#pv th,#pv td{border:1px solid #444;padding:5px;text-align:left;font-size:13px;color:#000}.phd{text-align:center;font-size:13px}.sig{display:flex;justify-content:space-between;margin-top:60px}}
.c0{background:#e6f0fd}.c1{background:#fde8f1}.c2{background:#efe8fc}.c3{background:#e3f5e6}
@media (prefers-color-scheme:dark){.c0{background:#1f2a55}.c1{background:#3a2140}.c2{background:#2d2354}.c3{background:#173a2b}}
.top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font:700 20px Georgia,serif}.stats span{font-size:14px;color:var(--mut)}
img.ph{width:70px;height:70px;object-fit:cover;border-radius:6px;border:1px solid var(--line);margin-top:6px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 40px;max-width:640px;margin:0 auto}
.row{padding:11px 4px;border-bottom:1px solid var(--line)}
.note{background:rgba(201,150,26,.15);border-radius:7px;padding:8px 10px;font-size:13px;margin-top:10px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%}.toast.show{opacity:1}
.seg{display:flex;gap:6px;overflow-x:auto}.seg button{flex:1;padding:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:600 13px inherit}.seg button.on{background:var(--ac);color:var(--on)}
</style>

<body>
<div id="app"></div>
<div class="toast" id="t"></div>
<script>
/* ===== SETUP: paste your Firebase web config here (see README) ===== */
const CFG=/*CFG*/{}/*CFG*/;   // filled by scripts/build-production.mjs from the GFive Sales Firebase env
const OWN_GSTIN="";   // your own company GSTIN, so the bill reader skips it
/* ================================================================== */
const $=i=>document.getElementById(i);
const esc=x=>String(x==null?"":x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=$("t");t.textContent=m;t.className="toast show";setTimeout(()=>t.className="toast",2800)};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayKey=()=>{const d=new Date(Date.now()-4*36e5);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()};
const clean=o=>{const r={};for(const k in o)if(o[k]!==undefined&&o[k]!==null&&o[k]!=="")r[k]=o[k];return r};
const num=x=>+x||0;
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const PW=p=>"GF"+p+"#7",EM=m=>m+"@gfive.app";
firebase.initializeApp(CFG);
const auth=firebase.auth(),fs=firebase.firestore();
const P="jw_",jc=c=>fs.collection(P+c);   // Job Work data lives next to GFive Sales data as jw_*
/* server helper (AI photo reading, starter masters) */
async function jwApi(path,body){const u=auth.currentUser;if(!u)throw new Error("Please login again");const r=await fetch("/api/jw/"+path,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+await u.getIdToken()},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("Server "+r.status));return j}
fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const COLS=["vendors","karigars","fabrics","designs","inward","issues","receipts","deliveries","categories","payments","opening","settings","orders","costs","alters","alttypes","users"];
const D={};COLS.forEach(c=>D[c]=[]);
let ME=null,TAB="bal",MK="vendors",Q="",QK="",PH=null,KEEP={},subbed=false,pendCols={};
const DEF_CATS=["Dyeing","Hand work","Katha","Tailor / Finishing","Computer work","Machine Embroidery","Applique work","Print","Khaka"];
const PL=()=>{const a=D.categories.filter(x=>!x.inactive).sort((x,y)=>(+x.order||999)-(+y.order||999)||x.name.localeCompare(y.name));return a.length?a.map(x=>x.name):DEF_CATS};
const MF={vendors:[["name","Vendor name",0,1],["gstin","GST no"],["phone","Phone"],["address","Address",0,1]],karigars:[["name","Karigar / jobber name",0,1],["phone","Phone"],["proc","Category","proc"]],fabrics:[["fabNo","Fabric no"],["rate","Rate Rs/mtr","number"],["name","Fabric name",0,1],["width","Width / remarks",0,1]],designs:[["design","Design no",0,1],["desc","Description",0,1]],categories:[["name","Category name (Dyeing, Print...)",0,1]],alttypes:[["name","Alteration work name",0,1],["proc","Karigar category","proc"]]};
const MKEY={vendors:"name",karigars:"name",fabrics:"fabNo",designs:"design",categories:"name",alttypes:"name"};
const MT={vendors:"Vendors",karigars:"Karigars",fabrics:"Fabrics",designs:"Designs",categories:"Categories",alttypes:"Alteration types"};
const DEF_ALT=[{name:"Dyeing (re-dye)",proc:"Dyeing"},{name:"Hand work repair",proc:"Hand work"},{name:"Piping repair",proc:"Tailor / Finishing"},{name:"Stitching repair",proc:"Tailor / Finishing"},{name:"Other",proc:""}];
const ALL=()=>{const a=D.alttypes.filter(x=>!x.inactive).sort((x,y)=>(+x.order||999)-(+y.order||999)||x.name.localeCompare(y.name));return a.length?a:DEF_ALT};
const AL=()=>ALL().map(x=>x.name),altCat=n=>(ALL().find(x=>x.name===n)||{}).proc||"";
const altRet=x=>(x.returns||[]).reduce((t,y)=>t+num(y.q),0),altPend=x=>Math.max(0,num(x.qty)-altRet(x));
const FF={
inward:[["date","Received date","date"],["bill","Bill no"],["vendor","Vendor","pick:vendors",1],["gstin","GST no"],["po","PO no"],["item","Item / vendor code (1430SD, Taffeta...)",0,1],["qty","Quantity","number"],["unit","Unit","unit"],["rate","Rate Rs","number"],["courier","Courier / how it came"],["fabNo","Our fabric no (F...)","pick:fabrics",1],["remarks","Remarks",0,1]],
issues:[["challan","Challan no"],["date","Issue date","date"],["karigar","Karigar","pick:karigars",1],["proc","Category","proc"],["design","Design no","pick:designs"],["jobCard","Job card / sample no","pick:orders"],["sample","SAMPLE issue (not production)","check",1],["rows","Colours and pieces","rows",1],["rate","Job rate Rs/pc","number"],["total","Total mtr/pc on challan (top + dup)","number",1],["topFab","Top fabric no","pick:fabrics"],["topMtr","Top mtr/pc","number"],["dupFab","Dup fabric no (blank = same)","pick:fabrics"],["dupMtr","Dup mtr/pc","number"],["due","Return by (due date)","date"],["desc","Description",0,1],["remarks","Remarks",0,1]],
receipts:[["line","Challan line","pick:lines",1],["date","Receive date","date"],["qty","Qty received","number"],["rate","Job rate Rs/pc","number"],["remarks","Remarks / ERP RCV no",0,1],["ready","Ready for delivery (final stage of this design)","check",1]],
orders:[["jobCard","Job card no / S.No (e.g. P256)"],["design","Design no","pick:designs"],["brand","Brand (auto from design no)","opt:brand"],["party","For party / buyer (optional)","opt:party"],["orderType","Order type","opt:orderType"],["orderDate","Order date","date"],["qty","Order qty (pcs)","number"],["deliveryDate","Delivery date (planned)","date"],["topFab","Top fabric","pick:fabname",1],["dupFab","Dupatta fabric","pick:fabname",1],["botFab","Bottom fabric","pick:fabname",1],["accessories","Accessories (lace, funda...)",0,1],["colours","Colours (choose 4-8)","multi:colour",1],["remarks","Remarks",0,1]],
alters:[["date","Issue date","date"],["challan","Alteration challan no"],["design","Design no","pick:designs"],["jobCard","Job card / sample no (optional)","pick:orders"],["colour","Colour","opt:colour"],["altType","Alteration work","alt"],["karigar","Karigar","pick:karigars",1],["qty","Qty (pcs)","number"],["rate","Alteration rate Rs/pc","number"],["due","Return by","date"],["reason","What to alter / defect",0,1],["fromStock","Taken from ready stock","check",1],["remarks","Remarks",0,1]],
deliveries:[["date","Delivery date","date"],["challan","Delivery challan / invoice no"],["party","Delivered to (party)","opt:party",1],["design","Design no","pick:designs"],["qty","Qty delivered (pcs)","number"],["remarks","Remarks",0,1]]};
const TITLE={inward:"Fabric inward",issues:"Issue to karigar",receipts:"Receive from karigar",alters:"Alteration (send to karigar)",deliveries:"Delivery / dispatch",orders:"New order / job card"};
const can=a=>ME&&(ME.role==="super"||(ME.perms&&ME.perms[a]));
const rcv=id=>D.receipts.filter(r=>r.line===id).reduce((a,r)=>a+num(r.qty),0);
const frate=n=>{const f=D.fabrics.find(x=>x.fabNo===n);return f?num(f.rate):0};
const iu=x=>x.unit||(x.mtr?"Mtr":"Pcs"),iq=x=>x.qty!=null?num(x.qty):num(x.mtr||x.pcs);
const fcost=x=>num(x.topMtr)*frate(x.topFab)+num(x.dupMtr)*frate(x.dupFab||x.topFab);

/* ---------- login / session (OTP) ---------- */
const BOOT=/*BOOT*/[]/*BOOT*/;   // super admin mobiles, filled at build from NEXT_PUBLIC_JW_BOOT_PHONES
const PERMS=[["add","Make entries (inward, issue, receive)"],["del","Delete entries"],["masters","Add / edit / delete masters"],["export","Download Excel"],["rates","See rates and amounts"],["ledger","Karigar ledger and payments"]];
const PRESET={super:{add:1,del:1,masters:1,export:1,rates:1,ledger:1},admin:{add:1},sub:{add:1,masters:1,export:1,rates:1},staff:{add:1}};
const DEF_USERS=/*USERS*/[]/*USERS*/;   // [name, 10-digit mobile, role] filled at build from JW_DEFAULT_USERS
let CR=null,RV=null,NORMALCAP=false;
function loginView(msg,noOtp){if(noOtp){$("app").innerHTML='<div class="card" style="margin-top:40px"><h1>GFive Job-Work</h1><p class="bad">'+esc(msg)+'</p><a class="btn" style="display:block;text-align:center;text-decoration:none" href="/start">Open GFive Dashboard</a></div>';return}
$("app").innerHTML='<div class="card" style="margin-top:40px"><h1>GFive Designers Couture</h1><p class="sm">Login with your mobile number and OTP. The same login opens GFive Sales and Job Work.</p><label>Mobile number</label><input id="lm" type="tel" inputmode="numeric" maxlength="10"><div id="rc"></div><button class="btn" id="so">Send OTP</button><div id="ob" hidden><label>OTP (6 digits)</label><input id="lo" type="tel" inputmode="numeric" maxlength="6"><button class="btn" id="vo">Verify and login</button></div><p class="bad" id="le">'+esc(msg||"")+'</p><p class="sm" style="text-align:center"><a href="/start">GFive Dashboard</a></p></div>';$("so").onclick=sendOtp;$("vo").onclick=verifyOtp}
async function sendOtp(){const m=$("lm").value.trim();$("le").textContent="";$("le").className="bad";if(!/^\d{10}$/.test(m)){$("le").textContent="Enter 10-digit mobile number";return}
if(!navigator.onLine){$("le").textContent="Internet is needed for OTP login.";return}
try{try{if(RV)RV.clear()}catch(x){}RV=null;$("rc").innerHTML="";RV=new firebase.auth.RecaptchaVerifier("rc",{size:NORMALCAP?"normal":"invisible"});$("so").disabled=true;CR=await auth.signInWithPhoneNumber("+91"+m,RV);$("ob").hidden=false;$("le").className="sm";$("le").textContent="OTP sent to "+m}catch(e){$("so").disabled=false;try{RV.clear()}catch(x){}RV=null;$("le").textContent="Could not send OTP: "+(e.code||e.message);if((e.code||"")==="auth/captcha-check-failed"){NORMALCAP=true;$("le").textContent="Captcha check failed. Press Send OTP again and tick the I am not a robot box that appears. If it keeps failing, add this site in Firebase Authorized domains and turn off ad-blocker or tracking protection."}}}
async function verifyOtp(){const c=$("lo").value.trim(),le=$("le");if(!/^\d{6}$/.test(c)){le.className="bad";le.textContent="Enter the 6-digit OTP";return}
le.className="sm";le.textContent="Checking OTP...";let r;
try{r=await CR.confirm(c)}catch(e){le.className="bad";le.textContent="OTP wrong or expired ("+(e.code||e.message)+"). Send OTP again.";return}
return afterLogin(r.user,le)}
/* after any login: OTP here, or the shared login from the GFive dashboard (same Firebase account) */
async function afterLogin(user,le){const say=(c,t)=>{if(le){le.className=c;le.textContent=t}else if(c==="bad")loginView(t)};const ph=user.phoneNumber,isb=BOOT.includes(ph);say("sm","OTP ok. Loading your account...");let u=null;
try{u=await Promise.race([jc("users").doc(ph).get(),new Promise((_,j)=>setTimeout(()=>j(new Error("timeout")),8000))])}
catch(e){if(!isb){say("bad","Login ok, but database not reachable ("+(e.code||e.message)+"). Check the internet, or ask the super admin to publish the Firestore rules.");return}}
const ex=!!(u&&u.exists);
if(!ex&&!isb){say("bad","This number ("+ph+") is not registered for Job Work. Ask a super admin to add it in More > Users.");return}
const d=ex?u.data():{name:"Super admin",role:"super"};if(isb)d.role="super";
const S={phone:ph,name:d.name||"",role:d.role,perms:d.perms||{}};saveSess(S);if(isb&&!ex)seedUsers();start(S)}
function saveSess(S){S.day=dayKey();S.ts=Date.now();localStorage.setItem("gf_sess",JSON.stringify(S))}
const EMAILMSG="You are signed in to GFive Sales with e-mail. To open Job Work, add your mobile number once on the GFive Dashboard.";
function boot(){const S=JSON.parse(localStorage.getItem("gf_sess")||"null");$("app").innerHTML='<p class="sm" style="text-align:center;margin-top:60px">Loading...</p>';
const un=auth.onAuthStateChanged(u=>{un();
if(u&&u.phoneNumber){if(S&&S.phone===u.phoneNumber){saveSess(S);start(S);return}afterLogin(u,null);return}
if(!u&&S&&!navigator.onLine&&Date.now()-S.ts<36*36e5){toast("Offline: continuing the earlier login");start(S);return}
if(S)localStorage.removeItem("gf_sess");loginView(u?EMAILMSG:"",!!u)})}
function logout(){localStorage.removeItem("gf_sess");auth.signOut().catch(()=>{}).finally(()=>{location.href="/admin/login"})}
function seedUsers(){const b=fs.batch();DEF_USERS.forEach(u=>b.set(jc("users").doc("+91"+u[1]),{name:u[0],mobile:u[1],role:u[2],perms:PRESET[u[2]]},{merge:true}));b.commit().then(()=>toast("Default users loaded")).catch(()=>{})}

/* ---------- start + data ---------- */
function start(S){ME=S;if(BOOT.includes(ME.phone))ME.role="super";TAB=can("add")?"issues":"bal";
if(!subbed){subbed=true;COLS.forEach(c=>{jc(c).onSnapshot({includeMetadataChanges:true},sn=>{D[c]=sn.docs.map(d=>({...d.data(),id:d.id}));pendCols[c]=sn.metadata.hasPendingWrites;
if(c==="users"){const me=D.users.find(u=>u.id===ME.phone);if(me&&!BOOT.includes(ME.phone)){ME.role=me.role;ME.perms=me.perms||{};ME.name=me.name;const f=JSON.parse(localStorage.getItem("gf_sess")||"{}");Object.assign(f,{role:ME.role,perms:ME.perms,name:ME.name});localStorage.setItem("gf_sess",JSON.stringify(f))}}
if(!document.querySelector(".ov"))refresh()},e=>{})})}
shell()}
function tabs(){const t=[["bal","Balance"],["stock","Stock"],["tna","TNA"],["sample","Sample TNA"]];if(can("rates"))t.push(["cost","Cost"]);if(can("add"))t.push(["inward","Inward"],["issues","Issue"],["receipts","Receive"],["deliveries","Delivery"],["alters","Alter"]);if(can("ledger"))t.push(["ledger","Ledger"]);t.push(["mast","Masters"],["more","More"]);return t}
function shell(){$("app").innerHTML='<div class="bar"><div><h1>GFive Job-Work</h1><span class="chip">'+esc(ME.name)+" | "+ME.role+'</span> <span class="chip">v13</span> <span class="chip" id="net"></span> <a class="btn s" style="text-decoration:none;display:inline-block;margin-top:4px" href="/start" title="GFive Dashboard">Home · Sales</a></div><div style="white-space:nowrap"><button class="btn s o" data-act="zm" data-v="-">A-</button> <button class="btn s o" data-act="zm" data-v="+">A+</button></div></div><nav id="nav"></nav><div id="F"></div><div id="L"></div>';draw()}
function net(){const n=$("net");if(!n)return;const p=Object.values(pendCols).some(x=>x);n.textContent=(navigator.onLine?"Online":"Offline")+(p?" | waiting to sync":"");n.className="chip "+(navigator.onLine&&!p?"ok":"bad")}
addEventListener("online",net);addEventListener("offline",net);
function draw(){$("nav").innerHTML=tabs().map(t=>'<button class="'+(t[0]===TAB?"on":"")+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+"</button>").join("");$("F").innerHTML=formView();if($("f_total")&&$("f_total").value&&typeof calcMtr==="function")calcMtr("total");lists();net()}
function refresh(){if(!$("L"))return;lists();net();if(TAB==="receipts"||TAB==="more"&&ME.role==="super")null}

/* ---------- forms ---------- */
function fld(f,v){const k=f[0],t=f[2]||"text",id="f_"+k,w=f[3]?"w":"";let i;
if(t==="rows")return rowsHtml(v);
if(t==="check")i='<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px;margin-top:6px"><input type="checkbox" id="'+id+'"'+(v===false?"":" checked")+' style="width:auto"> '+f[1]+"</label>";
else if(String(t).startsWith("opt:")||String(t).startsWith("multi:"))i='<input id="'+id+'" readonly placeholder="Tap to choose" data-opt="'+t.split(":")[1]+'"'+(t.startsWith("multi:")?' data-multi="1"':"")+' value="'+esc(v||"")+'">';else if(t==="alt")i='<select id="'+id+'">'+AL().map(p=>"<option"+(p===v?" selected":"")+">"+esc(p)+"</option>").join("")+"</select>";else if(t==="unit")i='<select id="'+id+'">'+["Pcs","Mtr"].map(p=>"<option"+(p===v?" selected":"")+">"+p+"</option>").join("")+"</select>";else if(t==="proc")i='<select id="'+id+'">'+PL().map(p=>"<option"+(p===v?" selected":"")+">"+p+"</option>").join("")+"</select>";
else if(String(t).startsWith("pick:"))i='<input id="'+id+'" readonly placeholder="Tap to choose or search" data-pick="'+t.slice(5)+'" data-k="'+k+'" value="'+esc(v||"")+'">';

const normN=s=>String(s||"").toUpperCase().replace(/\([^)]*\)/g," ").replace(/[^A-Z ]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function nearest(name,list){const n=normN(name);if(!n)return null;let best=null,bs=0;
(list||[]).forEach(x=>{const m=normN(x);if(!m)return;let sc=m===n?1:1-lev(n,m)/Math.max(n.length,m.length);
